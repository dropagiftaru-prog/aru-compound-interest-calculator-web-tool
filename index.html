<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* RESET & BASE */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #0f172a;
            color: #fef3c7;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        body.light {
            background: #fef9e7;
            color: #1e293b;
        }
        .container {
            max-width: 720px;
            width: 100%;
        }
        h1, h2 {
            font-family: Georgia, serif;
            font-weight: 400;
        }
        a { color: #d97706; }
        body.light a { color: #b45309; }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        header h1 {
            font-size: 1.8rem;
            letter-spacing: 0.02em;
        }
        #theme-toggle {
            background: none;
            border: 2px solid #d97706;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        #theme-toggle:hover { background: rgba(217, 119, 6, 0.15); }
        #theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: #d97706;
        }
        body.light #theme-toggle svg { fill: #b45309; }
        body.light #theme-toggle { border-color: #b45309; }

        /* MAIN CARD */
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        body.light .card {
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        /* INPUT GRID */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem 1.5rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748b;
            margin-bottom: 0.3rem;
        }
        body.light .input-group label { color: #64748b; }
        .input-group input, .input-group select {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            color: #fef3c7;
            transition: border 0.2s;
        }
        body.light .input-group input, body.light .input-group select {
            background: #fef9e7;
            border-color: #d1d5db;
            color: #1e293b;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #d97706;
        }
        .input-group input[type="number"] { -moz-appearance: textfield; }
        .input-group input[type="number"]::-webkit-outer-spin-button,
        .input-group input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* RESULTS ROW */
        .results-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0 0.5rem;
        }
        .result-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 1rem 0.8rem;
            text-align: center;
        }
        body.light .result-box { background: #fef9e7; }
        .result-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-bottom: 0.4rem;
        }
        .result-box .value {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        .result-box .value.gold { color: #d97706; }
        .result-box .value.slate { color: #64748b; }
        body.light .result-box .value.gold { color: #b45309; }
        body.light .result-box .value.slate { color: #4b5563; }

        /* CHART CARD */
        .chart-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 1.5rem 1.2rem 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            position: relative;
        }
        body.light .chart-card {
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .chart-card h2 {
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            color: #fef3c7;
        }
        body.light .chart-card h2 { color: #1e293b; }
        #chart-container {
            width: 100%;
            position: relative;
        }
        #chart-container svg {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
            overflow: visible;
        }
        #tooltip {
            position: absolute;
            background: #0f172a;
            border: 1px solid #d97706;
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            color: #fef3c7;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
        }
        body.light #tooltip {
            background: #fef9e7;
            color: #1e293b;
            border-color: #b45309;
        }
        .chart-legend {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: #64748b;
        }
        .chart-legend span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .legend-line {
            display: inline-block;
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }
        .legend-line.gold { background: #d97706; }
        .legend-line.slate { background: #64748b; border-top: 2px dashed #64748b; height: 0; border-bottom: 2px dashed #64748b; width: 20px; }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 1rem 0 0.5rem;
            font-size: 0.85rem;
            color: #64748b;
        }
        footer a { color: #d97706; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        body.light footer a { color: #b45309; }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            body { padding: 1rem; }
            header h1 { font-size: 1.4rem; }
            .card, .chart-card { padding: 1.2rem; }
            .input-grid { grid-template-columns: 1fr; gap: 0.9rem; }
            .results-row { grid-template-columns: 1fr; gap: 0.8rem; }
            .result-box .value { font-size: 1.1rem; }
            #chart-container svg { height: auto; }
            .chart-legend { flex-direction: column; align-items: center; gap: 0.4rem; }
        }
    </style>
